<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rastreamento | Mercado Jesi</title><link rel="stylesheet" href="assets/css/styles.css"><style>
.track-page{min-height:100vh;display:grid;place-items:center;padding:28px;background:#07090d;color:#f5f5f5}.track-card{width:min(720px,100%);padding:28px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:#10141d;box-shadow:0 25px 80px rgba(0,0,0,.35)}.track-head h1{margin:8px 0}.track-head p,.track-note{color:#9ca3af;line-height:1.6}.track-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.track-form label{display:grid;gap:6px;color:#aeb6c4;font-size:13px}.track-form input{min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:#090c12;color:#fff}.track-form .wide{grid-column:1/-1}.track-btn{min-height:46px;border:0;border-radius:10px;background:#d9a441;color:#16120a;font-weight:800;cursor:pointer}.track-result{border-top:1px solid rgba(255,255,255,.08);padding-top:20px}.track-status{font-size:22px;font-weight:800}.track-timeline{display:grid;gap:10px;margin-top:18px}.track-event{padding:12px;border-left:2px solid #d9a441;background:rgba(255,255,255,.03);border-radius:0 10px 10px 0}.track-event small{color:#8f98a8}.hidden{display:none}@media(max-width:600px){.track-form{grid-template-columns:1fr}.track-form .wide{grid-column:auto}}
</style></head><body><main class="track-page"><section class="track-card"><div class="track-head"><span class="eyebrow">MERCADO JESI</span><h1>Acompanhe seu pedido</h1><p>Informe o número do pedido, telefone usado na compra e o código de rastreamento recebido após o checkout.</p></div><form id="track-form" class="track-form"><label>Número do pedido<input name="order_number" inputmode="numeric" required placeholder="Ex.: 1024"></label><label>Telefone da compra<input name="phone" inputmode="tel" required placeholder="(00) 00000-0000"></label><label class="wide">Código de rastreamento<input name="tracking_code" required autocomplete="off" placeholder="Código recebido no checkout"></label><button class="track-btn wide" type="submit">Consultar pedido</button></form><div id="track-result" class="track-result hidden" aria-live="polite"></div><p class="track-note">Se você não recebeu o código de rastreamento, use o mesmo telefone da compra e fale com o Mercado Jesi.</p></section></main><script type="module" src="assets/js/tracking.js"></script></body></html>
