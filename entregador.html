<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b43"><title>Área do entregador | Mercado Jesi</title><link rel="stylesheet" href="assets/css/styles.css"><style>body{font-family:Nunito,system-ui,sans-serif;background:#f3f7f3;color:#203328}.driver{max-width:720px;margin:5vh auto;padding:24px}.card{background:white;border:1px solid #dfe9e1;border-radius:16px;padding:22px;margin:14px 0}.btn{padding:12px 16px;border:0;border-radius:10px;background:#176b43;color:#fff;font-weight:800;cursor:pointer;margin:5px 5px 5px 0}.btn:disabled{opacity:.5}.muted{color:#65776a}</style></head><body><main class="driver"><h1>Área do entregador</h1><p class="muted">Entre com sua conta de entregador. O GPS só será compartilhado durante uma entrega iniciada por você.</p><section class="card"><label>E-mail <input id="email" type="email" autocomplete="username"></label><label>Senha <input id="password" type="password" autocomplete="current-password"></label><button class="btn" id="login">Entrar</button><button class="btn" id="logout" hidden>Sair</button><p id="message" role="status"></p></section><section class="card"><h2>Minhas entregas</h2><div id="deliveries">Entre para carregar suas entregas.</div></section></main><script type="module" src="assets/js/driver-tracking.js"></script></body></html>
